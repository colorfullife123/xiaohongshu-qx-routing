# Quantumult X v2.4.0 rewrite-only Xiaohongshu IP routing
#
# Recommended final setup:
# 1 custom policy + 1 rewrite resource.
#
# Keep your existing visible server policy:
# 📤 小红书上传
#
# Add this remote rewrite resource:
# https://raw.githubusercontent.com/colorfullife123/xiaohongshu-qx-routing/qx-precise-routing-v2/rewrite/XHS-Write-IP.snippet
#
# Disable:
# - XHS-Strict-IP.list
# - old XHS-Publish-Precise.snippet
# - XHS-Upload.list (not required for displayed comment/note IP)
#
# Optional:
# Keep XHS-Direct.list only if you explicitly want *.xhscdn.com forced DIRECT.

[rewrite_remote]
https://raw.githubusercontent.com/colorfullife123/xiaohongshu-qx-routing/qx-precise-routing-v2/rewrite/XHS-Write-IP.snippet, tag=小红书发布IP, update-interval=86400, enabled=true

# Quantumult X MitM certificate must be installed/trusted.
# The rewrite resource already declares:
# hostname = edith.xiaohongshu.com
