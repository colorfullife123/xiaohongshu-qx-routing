# Xiaohongshu Quantumult X v2.4.3
# Recommended: 1 custom policy + 1 Rewrite resource.

[policy]
static = 📤 小红书上传, direct, proxy, resource-tag-regex=.*, server-tag-regex=^(?!.*(?:流量|剩余|到期|套餐|官网|客服|订阅|重置)).+$, img-url=https://raw.githubusercontent.com/colorfullife123/xiaohongshu-qx-routing/main/assets/xiaohongshu-policy.png

[rewrite_remote]
https://raw.githubusercontent.com/colorfullife123/xiaohongshu-qx-routing/main/rewrite/XHS-Write-IP.snippet, tag=小红书发布IP, update-interval=86400, enabled=true

# Requirements:
# - Quantumult X MitM certificate installed and trusted.
# - The rewrite resource declares hostname = edith.xiaohongshu.com.
#
# Disable old modes:
# - XHS-Strict-IP.list
# - XHS-Publish-Precise.snippet
# - XHS-Upload.list
#
# Optional:
# - XHS-Direct.list may be kept if you want *.xhscdn.com forced DIRECT.
